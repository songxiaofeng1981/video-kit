<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>口播模板预览</title>
<style>
:root{--bg:#0b0e13;--panel:#141a22;--line:#ffffff1a;--text:#eef1f5;--dim:#9aa6b3;--gold:#ffce80;--green:#7fe3a2;--red:#ff8f85}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:40px 16px 80px}
header h1{margin:0;font-size:30px;letter-spacing:.5px}
header p{margin:6px 0 0;color:var(--dim)}
h2{font-size:24px;margin:0 0 8px}
h2.section{margin-top:56px}
.dim,.note{color:var(--dim)}
.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}
.hero{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:40px;align-items:center;margin-top:32px;padding:28px;border:1px solid var(--line);border-radius:22px;background:var(--panel)}
.kicker{color:var(--gold);font-size:14px;letter-spacing:1px;margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;margin-top:20px}
.card{padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
.card h3{margin:12px 0 2px;font-size:18px}
.card h3 code{color:var(--gold);font-size:15px;margin-right:4px}
.card p{margin:2px 0;font-size:14px}
.fields{color:var(--dim);font-size:13px!important}
.sfx{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:16px}
.sfx button{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font:inherit;cursor:pointer}
.sfx button:hover{border-color:#ffce8070}
.sfx span{color:var(--gold)}
.sfx code{font-size:14px}
.sfx small{color:var(--dim);font-size:13px}
@media (max-width:720px){.hero{grid-template-columns:1fr;padding:16px;gap:20px}}
</style>
</head>
<body>
<main>
<header>
	<h1>磨砂玻璃卡口播模板 · 预览</h1>
	<p>竖屏单人口播：真人 + 磨砂玻璃卡，数据和过程切到深色画布。网页里实时播放，没有渲染。</p>
</header>
<div id="root"><p class="note">加载中…</p></div>
</main>
<script src="app.js"></script>
</body>
</html>
